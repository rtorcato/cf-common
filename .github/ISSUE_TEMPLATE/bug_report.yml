name: Bug report
description: Report a defect in @rtorcato/cf-common
labels: [bug]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which part of the package is affected?
      options:
        - cron
        - d1
        - env
        - errors
        - http
        - kv
        - r2
        - request
        - turnstile
        - other / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet or steps that trigger the bug.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Package version, wrangler version, compatibility date.
    validations:
      required: true
