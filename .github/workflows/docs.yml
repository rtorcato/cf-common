name: 📘 Deploy docs

on:
    push:
        branches: [main]
        # `src/**` so a shipped module regenerates its TypeDoc API page;
        # `package.json`/`README.md` so a release's version bump + readme
        # changes redeploy. Without src/**, merging a module never refreshed
        # the site (the original "docs don't show new stuff" bug).
        paths:
            - 'apps/docs/**'
            - 'src/**'
            - 'package.json'
            - 'README.md'
            - '.github/workflows/docs.yml'
            - 'pnpm-workspace.yaml'
    # semantic-release publishes a GitHub Release after the version commit lands;
    # rebuild then too, so the site always tracks the latest release.
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    # https://docs.torcato.dev/cf-common/
    # Pinned to a tag, never @main: this job hands over the Cloudflare secrets.
    cloudflare:
        permissions:
            contents: read
        uses: rtorcato/repo-tooling/.github/workflows/docs-deploy-cloudflare.yml@v6.0.0
        with:
            build-filter: '@rtorcato/cf-common-docs'
            worker-name: cf-common-docs
            base-path: /cf-common/
            route: docs.torcato.dev/cf-common/*
        secrets:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    # Old site: rtorcato.github.io/cf-common/ now only redirects to the new address.
    # GitHub Pages can't redirect server-side, so every path gets a meta-refresh
    # stub (index.html, plus 404.html so deep links land on the same page there).
    # ponytail: delete these two jobs once Pages is disabled in the repo settings.
    pages-redirect-build:
        runs-on: ubuntu-latest
        steps:
            - name: 🏗️ Write redirect stub
              run: |
                  mkdir -p stub
                  cat > stub/index.html <<'EOF'
                  <!doctype html>
                  <html lang="en">
                  <head>
                  <meta charset="utf-8">
                  <title>cf-common docs have moved</title>
                  <link rel="canonical" href="https://docs.torcato.dev/cf-common/">
                  <meta name="robots" content="noindex">
                  <meta http-equiv="refresh" content="0; url=https://docs.torcato.dev/cf-common/">
                  <script>
                  location.replace('https://docs.torcato.dev' + location.pathname + location.search + location.hash)
                  </script>
                  </head>
                  <body>
                  <p>The cf-common docs have moved to <a href="https://docs.torcato.dev/cf-common/">docs.torcato.dev/cf-common</a>.</p>
                  </body>
                  </html>
                  EOF
                  cp stub/index.html stub/404.html

            - name: 📤 Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: stub

    pages-redirect-deploy:
        needs: pages-redirect-build
        runs-on: ubuntu-latest
        concurrency:
            group: pages
            cancel-in-progress: false
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: 🚀 Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
